<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Keyboard Layout Detector</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="popup-container">
    <div class="header">
      <h2>🔤 Layout Detector</h2>
      <div class="header-right">
        <a id="howToUseBtn" class="how-to-use-link" href="#">How to use KLD</a>
        <div id="statusIcon" class="status-icon active">●</div>
      </div>
    </div>

    <div class="instructions">
      <p>📝 <strong>Focus on any text field</strong> and use the buttons below:</p>
    </div>

    <button id="fixCurrentWord" class="action-btn primary">
      <span class="btn-icon">🎯</span>
      <div class="btn-content">
        <div class="btn-title">Fix Current Word</div>
        <div class="btn-desc">Word at cursor — no dictionary check (Ctrl+Q)</div>
      </div>
    </button>

    <button id="autoFixAll" class="action-btn secondary">
      <span class="btn-icon">⚡</span>
      <div class="btn-content">
        <div class="btn-title">Smart Scan</div>
        <div class="btn-desc">Dictionary-filtered — only real words (Ctrl+Alt)</div>
      </div>
    </button>

    <button id="forceFixAll" class="action-btn force">
      <span class="btn-icon">💪</span>
      <div class="btn-content">
        <div class="btn-title">Force Fix All</div>
        <div class="btn-desc">No dictionary check — converts everything (Ctrl+Shift+Q)</div>
      </div>
    </button>

    <button id="undoBtn" class="action-btn undo">
      <span class="btn-icon">↶</span>
      <div class="btn-content">
        <div class="btn-title">Undo Last Change</div>
        <div class="btn-desc">Restore previous text (Ctrl+Z)</div>
      </div>
    </button>

    <div class="divider"></div>

    <label class="switch">
      <input type="checkbox" id="pauseExtension">
      <span class="slider"></span>
      Pause Extension
    </label>

    <div class="divider"></div>

    <div class="feedback-section">
      <button id="feedbackBtn" class="action-btn feedback">
        <span class="btn-icon">💬</span>
        <div class="btn-content">
          <div class="btn-title">Send Feedback</div>
          <div class="btn-desc">Help us improve the dictionary</div>
        </div>
      </button>
      <div id="feedbackPanel" class="feedback-panel">
        <div class="feedback-type-label">What type of feedback?</div>
        <div id="feedbackTypes" class="feedback-types" role="group" aria-label="Feedback type">
          <button class="feedback-chip active" data-type="bug" type="button">Bug</button>
          <button class="feedback-chip" data-type="dictionary" type="button">Wrong word</button>
          <button class="feedback-chip" data-type="suggestion" type="button">Suggestion</button>
          <button class="feedback-chip" data-type="ui" type="button">UI/Translation</button>
        </div>
        <textarea id="feedbackText" class="feedback-textarea"
          placeholder="Write a short message (1-2 lines is enough)..."></textarea>
        <div class="feedback-meta-note">Context is auto-added: page, website, extension version, language, and time.</div>
        <button id="feedbackSubmit" class="feedback-send-btn">✉️ Send</button>
        <div id="feedbackSuccess" class="feedback-success">✅ Report received successfully!</div>
      </div>
    </div>

    <div id="status" class="status"></div>
  </div>
  <script src="popup.js"></script>
</body>

</html>
